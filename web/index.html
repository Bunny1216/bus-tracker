<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Real-time IoT city bus tracking: Gazipur Chowrasta to Abdullahpur.">
  <title>City Bus Tracker | Gazipur - Abdullahpur</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="glass-header">
    <h1>City Bus Tracker</h1>
    <p>Gazipur Chowrasta &rarr; Abdullahpur</p>
    <p id="bus-status" class="status">Loading route&hellip;</p>
  </header>
  <div id="map" role="application" aria-label="Bus route map"></div>
  <div id="error-banner" class="error-banner" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Classic deferred script (not type="module") so the file:// error banner
       can still run; browsers block ES modules on file:// URLs. -->
  <script src="app.js" defer></script>
</body>
</html>
